# 編出「未簽章」的 PandaTimer.ipa，下載後用 SideStore（免費 Apple ID）重簽側載。
# 鐵律：App、widget、broadcast extension 都不得帶任何 entitlement（免費帳號簽不了推播/App Group 等）。
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Expo SDK 58 的 expo-modules-jsi 需要 swift-tools 6.2 → Xcode 26 以上
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: '1'
      ARCHIVE_PATH: ${{ github.workspace }}/build/PandaTimer.xcarchive
      LOG_PATH: ${{ github.workspace }}/build/xcodebuild.log

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # SDK 58 的預編譯 ExpoModulesCore 由 Swift 6.3.1 編出、Expo 版本表要求 Xcode 26.4+。
      # 選最新的正式版 Xcode 26（排除 beta/RC），版本不足直接失敗，省掉 15 分鐘白跑。
      - name: Select newest Xcode 26 (>= 26.4)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          swift --version
          pod --version
          XV=$(xcodebuild -version | head -1 | awk '{print $2}')
          if [ "$(printf '%s\n' 26.4 "$XV" | sort -V | head -1)" != "26.4" ]; then
            echo "::error::Xcode $XV < 26.4（Expo SDK 58 需要 Xcode 26.4+）"
            exit 1
          fi

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # OCR 分鐘挑選規則（與 native/intents/MinutePicker.swift 同一套）＋原生事件合併
      - name: Unit tests
        run: node --test

      # 多份必須逐字相同的 Swift 檔（ActivityKit 以型別名＋Codable 結構對應；規則檔兩邊要一致）
      - name: Guard - identical shared Swift files
        run: |
          set -e
          # v0.4：broadcast extension 不再用 ActivityKit（實測不可用），PandaTimerAttributes 剩 3 份
          for f in modules/live-activity/ios/PandaTimerAttributes.swift targets/widget/PandaTimerAttributes.swift; do
            diff -u native/intents/PandaTimerAttributes.swift "$f" || { echo "::error file=$f::PandaTimerAttributes.swift 各份不一致"; exit 1; }
          done
          diff -u native/intents/MinutePicker.swift targets/broadcast/MinutePicker.swift || { echo "::error::MinutePicker.swift 兩份不一致"; exit 1; }
          diff -u native/intents/DeliverActivityIntent.swift targets/widget/DeliverActivityIntent.swift || { echo "::error::DeliverActivityIntent.swift 兩份不一致"; exit 1; }
          # v0.5：偵測卡「開始倒數」按鈕的 intent（主 App 執行、widget 畫按鈕）
          diff -u native/intents/StartDetectedCountdownIntent.swift targets/widget/StartDetectedCountdownIntent.swift || { echo "::error::StartDetectedCountdownIntent.swift 兩份不一致"; exit 1; }
          if grep -rn 'import ActivityKit' targets/broadcast; then echo "::error::broadcast extension 不得 import ActivityKit（v0.3 實測不可用）"; exit 1; fi

      - name: Expo prebuild (iOS)
        run: npx expo prebuild -p ios --clean --no-install

      - name: Guard - no entitlements anywhere
        run: |
          set -e
          FILES=$(find ios targets -name '*.entitlements' -not -path '*/Pods/*' || true)
          for f in $FILES; do echo "== $f"; cat "$f"; echo; done
          for f in $FILES; do
            if grep -q '<key>' "$f"; then
              echo "::error file=$f::entitlements 不得含任何 key（SideStore 免費帳號簽不了）"
              exit 1
            fi
          done
          # 只允許主 App 那份（內容已在上面驗證為空 dict）；widget／PandaBroadcast 或其他 target 出現任何 CODE_SIGN_ENTITLEMENTS 都擋
          if grep 'CODE_SIGN_ENTITLEMENTS' ios/PandaTimer.xcodeproj/project.pbxproj | grep -v 'CODE_SIGN_ENTITLEMENTS = PandaTimer/PandaTimer.entitlements;'; then
            echo "::error::除了主 App 的空 entitlements 外，不應該有任何 target 設 CODE_SIGN_ENTITLEMENTS"
            exit 1
          fi
          # v0.3：PandaBroadcast target 必須存在（否則下面的 appex 檢查會晚 10 分鐘才失敗）
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.pandatimer.app.broadcast;' ios/PandaTimer.xcodeproj/project.pbxproj \
            || { echo "::error::pbxproj 沒有 PandaBroadcast（com.pandatimer.app.broadcast）"; exit 1; }
          # v0.5：保活靠 Info.plist 的 UIBackgroundModes=[location, audio]＋兩個定位說明字串（都不是 entitlement）
          PL=ios/PandaTimer/Info.plist
          for M in location audio; do
            /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$PL" | grep -qx "[[:space:]]*$M" \
              || { echo "::error::主 App Info.plist 的 UIBackgroundModes 沒有 $M"; exit 1; }
          done
          for K in NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$K" "$PL" | grep -q . \
              || { echo "::error::主 App Info.plist 缺 $K（背景定位保活需要）"; exit 1; }
          done
          RV=$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRuntimeVersion' ios/PandaTimer/Supporting/Expo.plist)
          WANT=$(node -p "require('./app.json').expo.runtimeVersion")
          echo "EXUpdatesRuntimeVersion=$RV（app.json：$WANT）"
          [ "$RV" = "$WANT" ] || { echo "::error::Expo.plist 的 EXUpdatesRuntimeVersion=$RV 與 app.json runtimeVersion=$WANT 不一致"; exit 1; }

      - name: Pod install
        working-directory: ios
        run: pod install

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -workspace ios/PandaTimer.xcworkspace \
            -scheme PandaTimer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            > "$LOG_PATH" 2>&1 || {
              echo "::error::xcodebuild archive 失敗，以下為錯誤行與最後 150 行"
              grep -E 'error:|\*\* ARCHIVE FAILED' "$LOG_PATH" | head -60 || true
              tail -150 "$LOG_PATH"
              exit 1
            }
          tail -5 "$LOG_PATH"

      - name: Verify app bundle and package IPA
        run: |
          set -e
          APP="$ARCHIVE_PATH/Products/Applications/PandaTimer.app"
          test -d "$APP" || { echo "::error::找不到 $APP"; ls -R "$ARCHIVE_PATH/Products" | head -50; exit 1; }
          ls -la "$APP/PlugIns" || true
          # v0.3：Live Activity widget 與螢幕廣播偵測 extension 都必須嵌入
          for N in PandaWidget PandaBroadcast; do
            test -d "$APP/PlugIns/$N.appex" || { echo "::error::PlugIns/$N.appex 不存在（沒被嵌入）"; exit 1; }
          done
          for X in "$APP"/PlugIns/*.appex; do
            echo "appex: $X"
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$X/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$X/Info.plist"
          done
          BX="$APP/PlugIns/PandaBroadcast.appex"
          EP=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$BX/Info.plist")
          PC=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$BX/Info.plist")
          PM=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:RPBroadcastProcessMode' "$BX/Info.plist")
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$BX/Info.plist")
          echo "PandaBroadcast: $EP / $PC / $PM / $BID"
          [ "$EP" = "com.apple.broadcast-services-upload" ] || { echo "::error::PandaBroadcast extension point 錯：$EP"; exit 1; }
          [ "$PC" = "PandaBroadcast.SampleHandler" ] || { echo "::error::PandaBroadcast principal class 錯：$PC"; exit 1; }
          [ "$PM" = "RPBroadcastProcessModeSampleBuffer" ] || { echo "::error::RPBroadcastProcessMode 錯：$PM"; exit 1; }
          [ "$BID" = "com.pandatimer.app.broadcast" ] || { echo "::error::PandaBroadcast bundle id 錯：$BID"; exit 1; }
          # 簽章前沒有 entitlements 可驗；確認 build 產物裡沒有任何 .xcent／entitlements 檔
          if find "$APP" -name '*.xcent' -o -name '*.entitlements' | grep .; then
            echo "::error::app bundle 內出現 entitlements 檔"; exit 1
          fi
          test -f "$APP/main.jsbundle" || { echo "::error::main.jsbundle 不存在（JS 沒打包進 Release）"; exit 1; }
          # v0.2 App Intents：metadata 必須擷取進主 App，否則捷徑 App 看不到「熊貓倒數」的動作（編譯不會報錯，只會靜默消失）
          AI="$APP/Metadata.appintents/extract.actionsdata"
          test -f "$AI" || { echo "::error::$AI 不存在（App Intents metadata 沒被擷取）"; ls -la "$APP"; exit 1; }
          for N in StartFromScreenshotIntent DeliveredIntent DeliverActivityIntent StartDetectedCountdownIntent; do
            grep -q "$N" "$AI" || { echo "::error::主 App 的 App Intents metadata 缺 $N"; exit 1; }
          done
          echo "App Intents metadata OK: $(wc -c < "$AI") bytes"
          for X in "$APP"/PlugIns/PandaWidget.appex; do
            for N in DeliverActivityIntent StartDetectedCountdownIntent; do
              if [ -f "$X/Metadata.appintents/extract.actionsdata" ] && grep -q "$N" "$X/Metadata.appintents/extract.actionsdata"; then
                echo "widget metadata 含 $N: $X"
              else
                echo "::warning::$X 沒有含 $N 的 App Intents metadata（動態島按鈕可能無效）"
              fi
            done
          done
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist"
          for M in location audio; do
            /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" | grep -qx "[[:space:]]*$M" \
              || { echo "::error::打包後主 App 的 UIBackgroundModes 沒有 $M"; exit 1; }
          done
          for K in NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$K" "$APP/Info.plist" | grep -q . \
              || { echo "::error::打包後主 App 缺 $K"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../PandaTimer.ipa Payload)
          ls -la build/PandaTimer.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PandaTimer-unsigned-ipa
          path: build/PandaTimer.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
